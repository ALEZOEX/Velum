name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.2.0)'
        required: false
        default: 'dev'

env:
  FLUTTER_VERSION: '3.47.9'
  GO_VERSION: '1.27.3'

jobs:
  # ─── Go daemon (статический бинарь — работает на любом дистре) ──────────────
  daemon-linux:
    name: Daemon / Linux (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: daemon/go.sum
      - name: Build sing-box core
        run: make core
      - name: Build velumd (linux/amd64, static)
        # CGO_ENABLED=0 — нет CGO в коде, бинарь полностью статический
        run: cd daemon && CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../bin/velumd .
      - uses: actions/upload-artifact@v4
        with:
          name: velumd-linux
          path: |
            bin/velumd
            bin/sing-box

  daemon-windows:
    name: Daemon / Windows (cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: daemon/go.sum
      - name: Build sing-box core (windows)
        run: GOOS=windows GOARCH=amd64 GOBIN=$(pwd)/bin go install -ldflags "-X github.com/sagernet/sing-box/constant.Version=1.12.12" -tags with_utls,with_quic,with_clash_api github.com/sagernet/sing-box/cmd/sing-box@v1.12.12
      - name: Build velumd.exe
        run: cd daemon && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../bin/velumd.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: velumd-windows
          path: |
            bin/velumd.exe
            bin/sing-box.exe

  # ─── Flutter Linux (матрица дистрибутивов) ──────────────────────────────────
  flutter-linux:
    name: Flutter / ${{ matrix.distro }}
    runs-on: ubuntu-latest
    needs: daemon-linux

    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu — нативный runner
          - distro: ubuntu
            container: ''
            setup_deps: |
              sudo apt-get update
              sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
            artifact: velum-linux-ubuntu-x64

          # Debian — контейнер debian:latest
          - distro: debian
            container: debian:latest
            setup_deps: |
              apt-get update
              apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev curl unzip git xz-utils
            artifact: velum-linux-debian-x64

          # Arch Linux / CachyOS — контейнер archlinux:latest
          - distro: arch
            container: archlinux:latest
            setup_deps: |
              pacman -Syu --noconfirm
              pacman -S --noconfirm clang cmake ninja pkgconf gtk3 curl unzip git which xz
            artifact: velum-linux-arch-x64

          # Fedora / RHEL-based
          - distro: fedora
            container: fedora:latest
            setup_deps: |
              dnf install -y clang cmake ninja-build pkgconf gtk3-devel curl unzip git which xz
            artifact: velum-linux-fedora-x64

          # openSUSE
          - distro: opensuse
            container: opensuse/leap:latest
            setup_deps: |
              zypper install -y clang cmake ninja pkgconf-pkg-config gtk3-devel curl unzip git xz
            artifact: velum-linux-opensuse-x64

    container:
      image: ${{ matrix.container }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: ${{ matrix.setup_deps }}

      # subosito/flutter-action скачивает Flutter через curl — работает в любом контейнере
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Flutter build linux
        working-directory: app
        run: flutter build linux --release

      - name: Download daemon artifacts
        uses: actions/download-artifact@v4
        with:
          name: velumd-linux
          path: app/build/linux/x64/release/bundle/bin/

      - name: Set executable bits
        run: |
          chmod +x app/build/linux/x64/release/bundle/bin/velumd
          chmod +x app/build/linux/x64/release/bundle/bin/sing-box

      - name: Package
        run: |
          cd app/build/linux/x64/release
          tar -czf ${{ matrix.artifact }}.tar.gz bundle/
          mv ${{ matrix.artifact }}.tar.gz ../../../../../

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  # ─── Flutter Windows ────────────────────────────────────────────────────────
  flutter-windows:
    name: Flutter / Windows
    runs-on: windows-latest
    needs: daemon-windows
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get
      - name: Flutter build windows
        working-directory: app
        run: flutter build windows --release
      - name: Download daemon artifacts
        uses: actions/download-artifact@v4
        with:
          name: velumd-windows
          path: app/build/windows/x64/runner/Release/bin/
      - name: Package
        shell: pwsh
        run: |
          $src = "app/build/windows/x64/runner/Release"
          Compress-Archive -Path "$src/*" -DestinationPath "velum-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: velum-windows
          path: velum-windows-x64.zip

  # ─── Release ────────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [flutter-linux, flutter-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
      - name: Flatten artifacts
        run: |
          find dist/ -type f \( -name "*.tar.gz" -o -name "*.zip" \) \
            -exec mv {} dist/ \;
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
