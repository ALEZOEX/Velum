name: Checks

on: [push, pull_request]

env:
  FLUTTER_VERSION: '3.47.9'
  GO_VERSION: '1.27.3'

jobs:
  daemon:
    name: Daemon tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: daemon/go.sum
      - name: Run tests & vet
        run: make test
      - name: Smoke-build daemon (linux, static)
        run: cd daemon && CGO_ENABLED=0 go build -o ../bin/velumd .
      - name: Smoke-build daemon (windows cross)
        run: cd daemon && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o ../bin/velumd.exe .

  flutter-linux:
    name: Flutter / ${{ matrix.distro }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            container: ''
            setup_deps: |
              sudo apt-get update
              sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

          - distro: debian
            container: debian:latest
            setup_deps: |
              apt-get update
              apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev curl unzip git xz-utils

          - distro: arch
            container: archlinux:latest
            setup_deps: |
              pacman -Syu --noconfirm
              pacman -S --noconfirm clang cmake ninja pkgconf gtk3 curl unzip git which xz

          - distro: opensuse
            container: opensuse/leap:latest
            setup_deps: |
              zypper install -y clang cmake ninja pkgconf-pkg-config gtk3-devel curl unzip git xz

    container:
      image: ${{ matrix.container }}

    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: ${{ matrix.setup_deps }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Analyze & test
        working-directory: app
        run: flutter pub get && flutter analyze && flutter test
      - name: Build linux
        working-directory: app
        run: flutter build linux --release
